services:
  - type: web
    name: tallyup-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w @tallyup/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # All four below are set manually in the Render dashboard after
      # creating the service — see README.md "Deploying" for where each
      # value comes from. DATABASE_URL is the production Supabase
      # project's Postgres connection string; SUPABASE_URL/ANON_KEY are
      # that same project's Auth API keys; CORS_ORIGIN is the deployed
      # Vercel URL. SUPABASE_SERVICE_ROLE_KEY is deliberately not listed
      # here — only the local seed script uses it, never the running app.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
