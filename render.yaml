services:
  - type: web
    name: tallyup-api
    runtime: node
    # Bumped from `free`: the free plan's 15-minute spin-down was causing
    # 20-30s+ cold-start delays for real customers (the GitHub Actions
    # keep-alive workaround in .github/workflows/keep-api-awake.yml helps
    # but can't fully guarantee it — GitHub's own scheduler isn't reliable
    # enough to depend on for this). Setting this in source doesn't charge
    # anything by itself: Render's Blueprint sync applies non-billing
    # changes automatically on push, but a plan upgrade needs a payment
    # method on the account and (per Render's own Blueprint behavior)
    # explicit approval in the dashboard before it actually takes effect —
    # check the dashboard after this deploys to confirm it's sitting as a
    # pending change rather than assuming it applied silently.
    plan: starter
    buildCommand: npm install
    startCommand: npm run start -w @tallyup/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # All of these are set manually in the Render dashboard after
      # creating the service — see README.md "Deploying" for where each
      # value comes from. DATABASE_URL is the production Supabase
      # project's Postgres connection string; SUPABASE_URL/ANON_KEY are
      # that same project's Auth API keys; CORS_ORIGIN is the deployed
      # Vercel URL. RESEND_API_KEY / RESEND_FROM send the staff-invitation
      # emails; without the key the api refuses to boot in production.
      # SUPABASE_SERVICE_ROLE_KEY is deliberately not listed here — only
      # the local seed script uses it, never the running app.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
