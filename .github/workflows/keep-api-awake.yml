name: Keep API awake

# render.yaml's api service runs on Render's free plan, which spins the
# service down after 15 minutes with no traffic — the next request then
# eats a 30-60s cold start (that's the delay customers hit on check-in).
# Pinging /health every 10 minutes keeps it from ever going idle, at no
# cost, without upgrading off the free Render plan. Runs on GitHub's
# schedule, which is free and unlimited on this public repo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 https://tallyup-api.onrender.com/health
