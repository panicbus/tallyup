services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tallyup
      POSTGRES_PASSWORD: tallyup
      POSTGRES_DB: tallyup_dev
    ports:
      - '5432:5432'
    volumes:
      - tallyup-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tallyup -d tallyup_dev']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  tallyup-postgres-data:
